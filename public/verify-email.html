<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子信箱驗證 — 麥當勞點餐系統</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #FFBA06;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 12px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 14px 36px;
            background: #FFBA06;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #e6a800;
            transform: scale(1.03);
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #eee;
            border-top-color: #FFBA06;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="spinner" id="spinner"></div>
        <h1 id="title">驗證中...</h1>
        <p id="message">正在確認您的電子信箱，請稍候。</p>
    </div>

    <script>
        async function verify() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                showResult('error', '⚠️', '無效的連結', '此驗證連結缺少必要的 Token，請重新至信箱點擊連結。');
                return;
            }

            try {
                const res = await fetch(`/api/verify-email?token=${encodeURIComponent(token)}`);
                const result = await res.json();

                if (result.status === 'success') {
                    showResult('success', '✅', '驗證成功！', result.message);
                } else if (result.status === 'already') {
                    showResult('info', '✔️', '已完成驗證', result.message);
                } else {
                    showResult('error', '❌', '驗證失敗', result.message);
                }
            } catch (e) {
                showResult('error', '⚠️', '發生錯誤', '無法連接至伺服器，請稍後再試。');
            }
        }

        function showResult(type, icon, title, message) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('title').textContent = title;
            document.getElementById('message').textContent = message;

            const card = document.getElementById('card');
            const iconEl = document.createElement('div');
            iconEl.className = 'icon';
            iconEl.textContent = icon;
            card.insertBefore(iconEl, card.firstChild);

            const btn = document.createElement('a');
            btn.className = 'btn';
            btn.href = '/';
            btn.textContent = '返回首頁';
            card.appendChild(btn);
        }

        verify();
    </script>
</body>
</html>
