<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麥當勞點餐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #FFBA06;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 20px;
            text-align: center;
            position: relative;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }
        .header h1 {
            color: white;
            font-size: 28px;
            margin: 0;
            margin-top: 40px;
            white-space: nowrap;
        }
        .login-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: white;
            color: #FFBA06;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .user-info {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: white;
            padding: 8px 15px;
            border-radius: 20px;
        }
        .user-info span {
            color: #333;
            font-weight: bold;
        }
        .logout-btn {
            padding: 5px 10px;
            background-color: #ff6b35;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
        }
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .start-btn {
            padding: 25px 60px;
            font-size: 24px;
            font-weight: bold;
            background-color: white;
            color: #FFBA06;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }
        .footer {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px 20px;
        }
        .footer-btn {
            padding: 15px 30px;
            font-size: 16px;
            background-color: rgba(255,255,255,0.9);
            color: #FFBA06;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .footer-btn:hover {
            background-color: white;
            transform: scale(1.05);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.show {
            display: flex;
        }
        .modal:not(.show) {
            display: none;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
        }
        .modal-content h2 {
            color: #FFBA06;
            text-align: center;
            margin-bottom: 20px;
        }
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .modal-content button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .modal-content .submit-btn {
            background: #FFBA06;
            color: white;
            font-weight: bold;
        }
        .modal-content .toggle-btn {
            background: transparent;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>麥當勞點餐方案計算</h1>
        <div id="loginSection">
            <button class="login-btn" onclick="showLoginModal()">登入</button>
        </div>
    </div>

    <div class="main">
        <button class="start-btn" onclick="location.href='menu.html'">選擇餐點</button>
    </div>

    <div class="footer">
        <button class="footer-btn" onclick="location.href='history.html'">歷史紀錄</button>
        <button class="footer-btn" onclick="location.href='favorites.html'">收藏清單</button>
    </div>

    <div class="modal" id="loginModal" onclick="closeLoginModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 id="modalTitle">登入</h2>
            <input type="text" id="username" placeholder="帳號">
            <input type="email" id="email" placeholder="電子信箱" style="display: none;">
            <input type="password" id="password" placeholder="密碼">
            <input type="password" id="confirmPassword" placeholder="確認密碼" style="display: none;">
            <button class="submit-btn" onclick="handleSubmit()" id="submitBtn">登入</button>
            <div style="display: flex; justify-content: space-between; margin-top: 5px;">
                <button class="toggle-btn" style="width: auto; padding: 5px; margin: 0; font-size: 14px;" onclick="toggleMode()" id="toggleBtn">還沒有帳號？註冊</button>
                <button class="toggle-btn" style="width: auto; padding: 5px; margin: 0; font-size: 14px; color: #ff6b35;" onclick="toggleResetMode()" id="forgotBtn">忘記密碼？</button>
            </div>
        </div>
    </div>

    <script>
        let modalMode = 'login'; // 'login', 'register', 'reset'

        async function checkLogin() {
            try {
                const response = await fetch('/api/check-session');
                const result = await response.json();
                const loginSection = document.getElementById('loginSection');
                
                if (result.status === 'success') {
                    loginSection.innerHTML = `
                        <div class="user-info">
                            <span>${result.username}</span>
                            <button class="logout-btn" onclick="logout()">登出</button>
                        </div>
                    `;
                } else {
                    loginSection.innerHTML = '<button class="login-btn" onclick="showLoginModal()">登入</button>';
                }
            } catch (error) {
                console.error('檢查登入失敗:', error);
            }
        }

        function showLoginModal() {
            document.getElementById('loginModal').classList.add('show');
            setModalMode('login');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('show');
            document.getElementById('username').value = '';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('confirmPassword').value = '';
        }

        function setModalMode(mode) {
            modalMode = mode;
            const titleEl = document.getElementById('modalTitle');
            const emailEl = document.getElementById('email');
            const passwordEl = document.getElementById('password');
            const confirmPasswordEl = document.getElementById('confirmPassword');
            const submitBtn = document.getElementById('submitBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const forgotBtn = document.getElementById('forgotBtn');

            if (mode === 'login') {
                titleEl.textContent = '登入';
                emailEl.style.display = 'none';
                passwordEl.placeholder = '密碼';
                passwordEl.style.display = 'block';
                confirmPasswordEl.style.display = 'none';
                submitBtn.textContent = '登入';
                toggleBtn.style.display = 'inline-block';
                toggleBtn.textContent = '還沒有帳號？註冊';
                forgotBtn.style.display = 'inline-block';
            } else if (mode === 'register') {
                titleEl.textContent = '註冊';
                emailEl.placeholder = '電子信箱';
                emailEl.style.display = 'block';
                passwordEl.placeholder = '密碼';
                passwordEl.style.display = 'block';
                confirmPasswordEl.placeholder = '確認密碼';
                confirmPasswordEl.style.display = 'block';
                submitBtn.textContent = '建立帳號';
                toggleBtn.style.display = 'inline-block';
                toggleBtn.textContent = '已有帳號？登入';
                forgotBtn.style.display = 'none';
            } else if (mode === 'reset') {
                titleEl.textContent = '重設密碼';
                emailEl.placeholder = '註冊時使用的 Email';
                emailEl.style.display = 'block';
                passwordEl.placeholder = '新密碼';
                passwordEl.style.display = 'block';
                confirmPasswordEl.placeholder = '確認新密碼';
                confirmPasswordEl.style.display = 'block';
                submitBtn.textContent = '重設密碼';
                toggleBtn.style.display = 'inline-block';
                toggleBtn.textContent = '返回登入';
                forgotBtn.style.display = 'none';
            }
        }

        function toggleMode() {
            if (modalMode === 'login') {
                setModalMode('register');
            } else {
                setModalMode('login');
            }
        }

        function toggleResetMode() {
            setModalMode('reset');
        }

        async function handleSubmit() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            
            if (!username) {
                alert('請輸入帳號');
                return;
            }

            if (modalMode === 'login') {
                if (!password) {
                    alert('請輸入密碼');
                    return;
                }

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        alert('登入成功！');
                        closeLoginModal();
                        checkLogin();
                    } else {
                        alert(result.message);
                    }
                } catch (error) {
                    alert('發生錯誤，請稍後再試');
                }
            } else if (modalMode === 'register') {
                const email = document.getElementById('email').value.trim();
                if (!email) {
                    alert('請輸入電子信箱');
                    return;
                }
                if (!password || !confirmPassword) {
                    alert('請輸入密碼與確認密碼');
                    return;
                }
                if (password !== confirmPassword) {
                    alert('密碼與確認密碼不一致');
                    return;
                }

                try {
                    const response = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, password })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        alert('註冊成功！已自動為您登入。');
                        closeLoginModal();
                        checkLogin();
                    } else {
                        alert(result.message);
                    }
                } catch (error) {
                    alert('發生錯誤，請稍後再試');
                }
            } else if (modalMode === 'reset') {
                const email = document.getElementById('email').value.trim();
                if (!email) {
                    alert('請輸入當初註冊的 Email');
                    return;
                }
                if (!password || !confirmPassword) {
                    alert('請輸入新密碼與確認密碼');
                    return;
                }
                if (password !== confirmPassword) {
                    alert('密碼與確認密碼不一致');
                    return;
                }

                try {
                    const response = await fetch('/api/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, newPassword: password })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        alert(result.message);
                        setModalMode('login');
                        document.getElementById('email').value = '';
                        document.getElementById('password').value = '';
                        document.getElementById('confirmPassword').value = '';
                    } else {
                        alert(result.message);
                    }
                } catch (error) {
                    alert('發生錯誤，請稍後再試');
                }
            }
        }

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                checkLogin();
            } catch (error) {
                console.error('登出失敗:', error);
            }
        }

        checkLogin();
    </script>
</body>
</html>
