<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選擇清單</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #FFBA06;
            padding: 20px;
            padding-bottom: 100px;
        }
        .top-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            position: relative;
        }
        .back-btn {
            padding: 10px 20px;
            font-size: 14px;
            background-color: white;
            color: #FFBA06;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        h1 {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            color: white;
            text-align: center;
        }
        .cart-item {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        .cart-item .info {
            flex: 1;
        }
        .cart-item .name {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        .cart-item .price {
            color: #ff6b35;
            font-weight: bold;
            margin-top: 5px;
        }
        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quantity-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: #ff6b35;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .quantity-btn:hover {
            background: #c44d1c;
        }
        .quantity-input {
            width: 50px;
            text-align: center;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px;
        }
        .cart-item .remove-btn {
            padding: 8px 12px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .cart-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
        }
        .cart-footer .total {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        .cart-footer .total span {
            color: #ff6b35;
        }
        .checkout-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .checkout-btn:hover {
            background: #c44d1c;
        }
        .empty-cart {
            text-align: center;
            color: white;
            font-size: 18px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="location.href='menu.html'">← 返回選擇</button>
        <h1>選擇清單</h1>
    </div>

    <div id="cartItems"></div>

    <div class="cart-footer">
        <div class="total">總金額: <span id="totalPrice">$0</span></div>
        <button class="checkout-btn" onclick="checkout()">查看方案</button>
    </div>

    <script>
        let cart = {};
        let mustHave = {};
        let itemsData = [];

        async function loadCart() {
            cart = {};
            mustHave = {};
            const savedCart = sessionStorage.getItem('cart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
            const savedMustHave = sessionStorage.getItem('mustHave');
            if (savedMustHave) {
                mustHave = JSON.parse(savedMustHave);
            }

            await loadItemsData();
            renderCart();
        }

        async function loadItemsData() {
            try {
                const response = await fetch('/api/items');
                const result = await response.json();
                if (result.status === 'success') {
                    itemsData = result.data;
                }
            } catch (error) {
                console.error('載入資料失敗:', error);
            }
        }

        function getImageSrc(itemName, category) {
            return `assets/${category}/${itemName}.avif`;
        }

        function getItemInfo(itemName) {
            return itemsData.find(item => item.item_name === itemName);
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            const cartItems = Object.entries(cart);

            if (cartItems.length === 0) {
                container.innerHTML = '<div class="empty-cart">尚未選擇任何餐點</div>';
                document.getElementById('totalPrice').textContent = '$0';
                return;
            }

            // 初始化預設值：若 mustHave 尚未設定，預設為 true（不能被替代）
            let mustHaveChanged = false;
            cartItems.forEach(([name]) => {
                if (mustHave[name] === undefined) {
                    mustHave[name] = true;
                    mustHaveChanged = true;
                }
            });
            if (mustHaveChanged) {
                sessionStorage.setItem('mustHave', JSON.stringify(mustHave));
            }

            let html = '';
            let total = 0;

            cartItems.forEach(([name, qty]) => {
                const item = getItemInfo(name);
                if (!item) return;

                const category = item.item_type;
                const imgSrc = getImageSrc(name, category);
                const subtotal = item.price * qty;
                total += subtotal;

                html += `<div class="cart-item">
                    <img src="${imgSrc}" alt="${name}">
                    <div class="info">
                        <div class="name">${name}</div>
                        <div class="price">$${item.price}</div>
                        <label style="font-size: 13px; color: #666; display: flex; align-items: center; margin-top: 5px; cursor: pointer;">
                            <input type="checkbox" onchange="toggleMustHave('${name}')" ${mustHave[name] !== false ? 'checked' : ''} style="margin-right: 5px;">
                            不能被替代
                        </label>
                    </div>
                    <div class="quantity-selector">
                        <button class="quantity-btn" onclick="changeQty('${name}', -1)">-</button>
                        <input type="number" class="quantity-input" id="qty-${name}" value="${qty}" min="0" readonly>
                        <button class="quantity-btn" onclick="changeQty('${name}', 1)">+</button>
                    </div>
                    <button class="remove-btn" onclick="removeItem('${name}')">刪除</button>
                </div>`;
            });

            container.innerHTML = html;
            document.getElementById('totalPrice').textContent = '$' + total;
        }

        function changeQty(name, delta) {
            const input = document.getElementById('qty-' + name);
            let qty = parseInt(input.value) + delta;
            
            if (qty <= 0) {
                delete cart[name];
                delete mustHave[name];
            } else {
                cart[name] = qty;
            }
            
            sessionStorage.setItem('cart', JSON.stringify(cart));
            sessionStorage.setItem('mustHave', JSON.stringify(mustHave));
            renderCart();
        }

        function toggleMustHave(name) {
            if (mustHave[name] === false) {
                mustHave[name] = true;
            } else {
                mustHave[name] = false;
            }
            sessionStorage.setItem('mustHave', JSON.stringify(mustHave));
        }

        function removeItem(name) {
            delete cart[name];
            delete mustHave[name];
            sessionStorage.setItem('cart', JSON.stringify(cart));
            sessionStorage.setItem('mustHave', JSON.stringify(mustHave));
            renderCart();
        }

        function checkout() {
            const cartItems = Object.entries(cart);
            if (cartItems.length === 0) {
                alert('尚未選擇任何餐點');
                return;
            }
            const cartData = JSON.stringify(cart);
            sessionStorage.setItem('checkoutCart', cartData);
            location.href = 'checkout.html';
        }

        loadCart();
    </script>
</body>
</html>
