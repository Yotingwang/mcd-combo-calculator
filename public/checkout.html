<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>計算結果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #FFBA06;
            padding: 20px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            position: relative;
        }

        .back-btn {
            padding: 15px 25px;
            font-size: 16px;
            background-color: white;
            color: #FFBA06;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            color: white;
            text-align: center;
        }

        .main-box {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            border: 2px solid #FFBA06;
            transition: all 0.3s ease;
        }

        .main-box.active-plan {
            border: 4px solid #2196F3;
            background: white;
            transform: scale(1.03);
            z-index: 10;
        }

        .main-box h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #FFBA06;
        }

        .item-row {
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-row.single {
            background: #FFF3E0;
            border-left: 4px solid #FF9800;
        }

        .item-row.combo {
            background: #E8F5E9;
            border-left: 4px solid #4CAF50;
        }

        .item-row.modified {
            background: #E3F2FD;
            border-left: 4px solid #2196F3;
        }

        .item-row.new {
            background: #FCE4EC;
            border-left: 4px solid #E91E63;
        }

        .item-name {
            color: #333;
            font-size: 15px;
        }

        .item-row.modified .item-name {
            color: #1976D2;
        }

        .item-row.new .item-name {
            color: #C2185B;
        }

        .item-price {
            color: #ff6b35;
            font-weight: bold;
            font-size: 15px;
        }

        .total-section {
            display: none;
        }

        .recommend-box {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .recommend-box h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #2196F3;
        }

        .recommend-item {
            margin-bottom: 20px;
            padding: 15px;
            padding-top: 35px;
            background: #F5F5F5;
            border-radius: 10px;
            position: relative;
        }

        .recommend-item h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .fav-btn-small {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            color: #E52D27;
            border: 1px solid #E52D27;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .fav-btn-small:hover {
            background: #FDF2F2;
            transform: translateY(-1px);
        }

        .plan-items {
            display: none;
        }

        .plan-items.expanded {
            display: block;
        }

        .toggle-btn {
            display: block;
            width: 100%;
            padding: 8px;
            background: #f5f5f5;
            color: #666;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 8px;
            text-align: center;
            transition: background 0.3s;
        }

        .toggle-btn:hover {
            background: #e8e8e8;
        }

        .toggle-btn::after {
            content: ' ▼';
            font-size: 12px;
        }

        .toggle-btn.expanded::after {
            content: ' ▲';
        }

        .fav-section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .fav-section h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #E91E63;
        }

        .fav-section select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }

        .fav-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #E91E63;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .fav-btn:hover {
            background: #C2185B;
        }

        .confirm-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .confirm-btn:hover {
            background: #45a049;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
            padding: 0;
        }

        .modal-content {
            background: white;
            border-radius: 24px 24px 0 0;
            padding: 25px 20px;
            padding-bottom: 40px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            z-index: 10;
        }

        .modal-fav-btn {
            position: absolute;
            top: 20px;
            right: 55px;
            background: #E91E63;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 13px;
            cursor: pointer;
            z-index: 10;
        }

        .modal-fav-btn:hover {
            background: #C2185B;
        }

        .modal-title {
            font-size: 22px;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4CAF50;
        }

        .modal-detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
            color: #444;
            padding: 5px 0;
            border-bottom: 1px dashed #eee;
        }

        .modal-detail-row.bold {
            font-weight: bold;
            color: #000;
        }

        .modal-copy-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .modal-copy-btn:hover {
            background: #1976D2;
        }

        .modal-submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: #FFBA06;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Tooltip styling */
        .tooltip-container {
            position: relative;
            display: inline-block;
            cursor: help;
        }
        .tooltip-text {
            visibility: hidden;
            width: 240px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 10px;
            position: absolute;
            z-index: 999;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 13px;
            line-height: 1.4;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            font-weight: normal;
        }
        .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #333 transparent transparent transparent;
        }
        .tooltip-container:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }

        /* Upsell card style changes */
        .upsell-highlight-box {
            background-color: #FFF8E1 !important;
            border: 2px dashed #FF8F00 !important;
            border-left: 6px solid #FF8F00 !important;
            padding: 12px 15px !important;
            margin-bottom: 12px !important;
            border-radius: 8px !important;
            font-size: 15px !important;
            color: #D84315 !important;
            animation: pulse-border 2s infinite alternate;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 5px rgba(255, 143, 0, 0.2); }
            100% { box-shadow: 0 0 12px rgba(255, 143, 0, 0.5); }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="top-bar">
            <button class="back-btn" onclick="location.href='menu.html'">← 返回選擇</button>
            <h1>最佳方案</h1>
        </div>


        <div class="filter-bar"
            style="margin-bottom: 20px; display: flex; justify-content: flex-end; align-items: center; gap: 10px;">
            <div style="display:flex;align-items:center;gap:10px;">
                <label for="sortSelect" style="color: white; font-weight: bold;">排序方式：</label>
                <select id="sortSelect" onchange="renderPlans()"
                    style="padding: 8px; border-radius: 8px; border: none; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); font-weight:bold; color: #333;">
                    <option value="savings">最多節省</option>
                    <option value="price">最低總價</option>
                </select>
            </div>
        </div>

        <div id="result"></div>
        <div id="recommendations"></div>

        <!-- Modal HTML completely removed as per accordion strategy -->

    <script>
        let itemsData = [];
        let combosData = [];
        let cart = {};
        let mustHave = {};
        let planOptions = [];

        let activeHistoryTimers = {};
        let writtenHistoryPlans = new Set();

        async function saveToHistorySilently(index) {
            if (writtenHistoryPlans.has(index)) return;
            const plan = planOptions[index];
            if (!plan) return;

            writtenHistoryPlans.add(index);
            try {
                await fetch('/api/history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(plan)
                });
            } catch (e) {
                console.error('自動寫入歷史紀錄失敗:', e);
            }
        }

        function togglePlanItems(index) {
            const allBoxes = document.querySelectorAll('.main-box');
            
            const content = document.getElementById('plan-items-' + index);
            const btn = document.getElementById('toggle-btn-' + index);
            const box = document.getElementById('main-box-' + index);

            if (!content || !btn) return;

            const isCurrentlyExpanded = content.classList.contains('expanded');

            // 1. 收合所有其他方案，並清除其計時器
            planOptions.forEach((_, idx) => {
                if (idx !== index) {
                    const otherContent = document.getElementById('plan-items-' + idx);
                    const otherBtn = document.getElementById('toggle-btn-' + idx);
                    const otherBox = document.getElementById('main-box-' + idx);
                    
                    if (otherContent && otherContent.classList.contains('expanded')) {
                        otherContent.classList.remove('expanded');
                        otherBtn.classList.remove('expanded');
                        otherBtn.textContent = '▼ 展開完整方案';
                        if (otherBox) otherBox.classList.remove('active-plan');
                    }
                    
                    // 清除其他人的計時器
                    if (activeHistoryTimers[idx]) {
                        clearTimeout(activeHistoryTimers[idx]);
                        delete activeHistoryTimers[idx];
                    }
                }
            });

            // 2. 處理當前點擊的方案
            if (isCurrentlyExpanded) {
                // 收合
                content.classList.remove('expanded');
                btn.classList.remove('expanded');
                btn.textContent = '▼ 展開完整方案';
                if (box) box.classList.remove('active-plan');
                
                // 清除當前計時器
                if (activeHistoryTimers[index]) {
                    clearTimeout(activeHistoryTimers[index]);
                    delete activeHistoryTimers[index];
                }
            } else {
                // 展開
                allBoxes.forEach(el => el.classList.remove('active-plan'));
                
                content.classList.add('expanded');
                btn.classList.add('expanded');
                btn.textContent = '▲ 收合方案明細';
                if (box) box.classList.add('active-plan');

                // 啟動 30 秒自動寫入計時器 (如果尚未寫入過)
                if (!writtenHistoryPlans.has(index)) {
                    if (activeHistoryTimers[index]) {
                        clearTimeout(activeHistoryTimers[index]);
                    }
                    activeHistoryTimers[index] = setTimeout(() => {
                        saveToHistorySilently(index);
                        delete activeHistoryTimers[index];
                    }, 30000); // 30 秒
                }
            }
        }

        function scrollToPlan(index) {
            const box = document.getElementById('main-box-' + index);
            if (box) {
                // 使用原生的 window.scrollTo 配合 behavior: 'smooth'，此為瀏覽器層級優化，絕對不會卡頓跳針
                const currentScrollY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop;
                const targetY = box.getBoundingClientRect().top + currentScrollY - 80;

                window.scrollTo({
                    top: targetY,
                    behavior: 'smooth'
                });

                let hasTriggered = false;
                let isScrolling;
                let safetyTimeout;

                function triggerCompletion() {
                    if (hasTriggered) return;
                    hasTriggered = true;
                    
                    window.removeEventListener('scroll', checkScrollEnd);
                    if (safetyTimeout) clearTimeout(safetyTimeout);

                    // 1. 先收合其他卡片
                    planOptions.forEach((_, idx) => {
                        if (idx !== index) {
                            const otherContent = document.getElementById('plan-items-' + idx);
                            const otherBtn = document.getElementById('toggle-btn-' + idx);
                            const otherBox = document.getElementById('main-box-' + idx);
                            if (otherContent && otherContent.classList.contains('expanded')) {
                                otherContent.classList.remove('expanded');
                                otherBtn.classList.remove('expanded');
                                otherBtn.textContent = '▼ 展開完整方案';
                                if (otherBox) otherBox.classList.remove('active-plan');
                            }
                        }
                    });

                    // 2. 展開目標卡片
                    const content = document.getElementById('plan-items-' + index);
                    if (content && !content.classList.contains('expanded')) {
                        togglePlanItems(index);
                    }

                    // 3. 高亮動畫
                    box.style.boxShadow = '0 0 20px #2196F3';
                    setTimeout(() => {
                        box.style.boxShadow = '';
                    }, 1500);
                }

                function checkScrollEnd() {
                    window.clearTimeout(isScrolling);
                    isScrolling = setTimeout(() => {
                        triggerCompletion();
                    }, 100);
                }

                window.addEventListener('scroll', checkScrollEnd);
                
                // 設一個安全保險，若 1.5 秒內沒觸發 scroll 結束（例如已經在該位置），直接執行
                safetyTimeout = setTimeout(() => {
                    triggerCompletion();
                }, 1500);
            }
        }

        function parseComboItems(detail) {
            if (!detail) return [];
            if (detail.startsWith('[')) {
                return JSON.parse(detail);
            }
            return detail.split('/');
        }

        async function init() {
            const savedCart = sessionStorage.getItem('checkoutCart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
            const savedMustHave = sessionStorage.getItem('mustHave');
            if (savedMustHave) {
                mustHave = JSON.parse(savedMustHave);
            }

            if (Object.keys(cart).length === 0) {
                document.getElementById('result').innerHTML = '<p style="color:white;text-align:center">尚未選擇任何餐點</p>';
                return;
            }

            await Promise.all([loadItemsData(), loadCombosData()]);
            calculateOptimal();
        }

        async function loadItemsData() {
            try {
                const response = await fetch('/api/items');
                const result = await response.json();
                if (result.status === 'success') {
                    itemsData = result.data;
                }
            } catch (error) {
                console.error('載入資料失敗:', error);
            }
        }

        async function loadCombosData() {
            try {
                const response = await fetch('/api/combos');
                const result = await response.json();
                if (result.status === 'success') {
                    combosData = result.data;
                }
            } catch (error) {
                console.error('載入套餐失敗:', error);
            }
        }

        function getItemInfo(itemName) {
            return itemsData.find(item => item.item_name === itemName);
        }



        let allRawPlans = [];
        let _requestId = 0;

        async function calculateOptimal() {
            const reqId = ++_requestId;
            try {
                // 顯示載入中
                document.getElementById('result').innerHTML = '<p style="color:white;text-align:center">正在尋找最佳方案...</p>';
                document.getElementById('recommendations').innerHTML = '';

                const [resSweet, resNoSweet] = await Promise.all([
                    fetch('/api/optimize', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cart: cart, mustHave: mustHave, sweetheart: true })
                    }),
                    fetch('/api/optimize', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cart: cart, mustHave: mustHave, sweetheart: false })
                    })
                ]);

                const dataSweet = await resSweet.json();
                const dataNoSweet = await resNoSweet.json();

                if (reqId !== _requestId) return;

                if (dataSweet.status === 'error' && dataNoSweet.status === 'error') {
                    document.getElementById('result').innerHTML = `<p style="color:white;text-align:center">${dataSweet.message}</p>`;
                    return;
                }

                allRawPlans = [];

                function extractPlans(data, isSweet) {
                    if (!data || data.status === 'error') return;
                    if (data['func2']) allRawPlans.push({ key: 'func2' + (isSweet ? '_s' : '_n'), title: '最佳推薦', data: data['func2'], isSweet });
                    if (data['func1']) allRawPlans.push({ key: 'func1' + (isSweet ? '_s' : '_n'), title: '精簡方案', data: data['func1'], isSweet });
                    if (Array.isArray(data['func4'])) {
                        data['func4'].forEach((plan, i) => {
                            allRawPlans.push({ key: 'func4_' + i + (isSweet ? '_s' : '_n'), title: '升級推薦', data: plan, isSweet });
                        });
                    }
                }

                extractPlans(dataSweet, true);
                extractPlans(dataNoSweet, false);

                renderPlans();

            } catch (error) {
                if (reqId !== _requestId) return;
                console.error(error);
                document.getElementById('result').innerHTML = '<p style="color:white;text-align:center">計算失敗，請稍後再試</p>';
            }
        }

        function renderPlans() {
            if (!allRawPlans || allRawPlans.length === 0) return;

            const sortMode = document.getElementById('sortSelect').value;

            let validPlans = allRawPlans.filter(p => p.data && p.data.status === 'success' && p.data.combos && p.data.combos.length > 0);

            // 重新判定真正的 isSweet (只要 combos 裡面有甜心卡才算)
            validPlans.forEach(p => {
                p.isSweet = p.data.combos.some(c => c.option_name === '甜心卡');
            });

            // 取得將方案內所有品項攤平的特徵字串
            const getItemsSignature = (plan) => {
                const items = [];
                if (plan.combos) {
                    plan.combos.forEach(c => {
                        c.items.forEach(it => {
                            for (let i = 0; i < c.qty; i++) items.push(it);
                        });
                    });
                }
                if (plan.single_items) {
                    plan.single_items.forEach(si => {
                        for (let i = 0; i < si.qty; i++) {
                            items.push(si.name);
                        }
                    });
                }
                return items.sort().join('|');
            };

            // 去除重複方案（總價與獲得的所有品項完全相同的視為重複）
            const uniquePlansMap = new Map();
            validPlans.forEach(p => {
                // 產生一個與「套餐如何組合」無關，只看「最終拿到什麼」的特徵字串
                const key = p.data.total + '|' + getItemsSignature(p.data);

                if (!uniquePlansMap.has(key)) {
                    uniquePlansMap.set(key, p);
                } else {
                    const existing = uniquePlansMap.get(key);
                    // 若這兩個方案內容完全相同，且有一個標記為 isSweet 但另一個不是，優先保留不是的
                    if (existing.isSweet && !p.isSweet) {
                        uniquePlansMap.set(key, p);
                    }
                }
            });
            validPlans = Array.from(uniquePlansMap.values());

            // 排序邏輯
            validPlans.sort((a, b) => {
                if (sortMode === 'savings') {
                    return b.data.savings - a.data.savings;
                } else {
                    return a.data.total - b.data.total;
                }
            });

            planOptions = [];
            let html = '';

            validPlans.forEach((p, index) => {
                const isBest = (index === 0);
                const planData = p.data;
                const planIndex = planOptions.length;

                const planForModal = {
                    title: p.title,
                    isSweet: p.isSweet,
                    combos: planData.combos,
                    single_items: planData.single_items,
                    extra_items: planData.extra_items,
                    total: planData.total,
                    savings: planData.savings,
                    originalTotal: planData.original_total,
                    replaced: planData.replaced || []
                };
                planOptions.push(planForModal);

                let blockHtml = '';
                blockHtml += `<div class="main-box" id="main-box-${planIndex}">`;

                let sweetBadge = '';
                if (p.isSweet) {
                    sweetBadge = '<span style="border:1px solid #7B1FA2;color:#7B1FA2;background:#F3E5F5;font-size:12px;padding:3px 8px;border-radius:12px;vertical-align:middle;font-weight:600;">💳 需有甜心卡</span>';
                } else {
                    let diffAmount = 0;
                    
                    // 尋找「品項內容完全一樣（包含 combos 和 single_items），但使用了甜心卡」的方案
                    // 我們將 combos 裡的商品與單點的商品全部展開成一個品項清單來做完全一致的比對
                    const currentSignature = getItemsSignature(planData);
                    
                    // 在有甜心卡的方案中，找出品項特徵完全一致，且價格比當前低的方案
                    // 為了能在畫面上跳轉，我們要在已渲染/排序的 validPlans 陣列中找出它的對應索引
                    let sweetEquivalentIndex = -1;
                    
                    const sweetEquivalent = allRawPlans.find(sp => {
                        return sp.isSweet && sp.data && sp.data.status === 'success' && 
                               getItemsSignature(sp.data) === currentSignature && 
                               sp.data.total < planData.total;
                    });

                    if (sweetEquivalent) {
                        diffAmount = planData.total - sweetEquivalent.data.total;
                        
                        // 比對總價與組合，在當前已排序的 validPlans 找到對應的 planIndex
                        sweetEquivalentIndex = validPlans.findIndex(vp => {
                            return vp.isSweet && vp.data.total === sweetEquivalent.data.total &&
                                   getItemsSignature(vp.data) === currentSignature;
                        });
                    }

                    if (diffAmount > 0 && sweetEquivalentIndex !== -1) {
                        sweetBadge = `
                            <span class="tooltip-container" style="border:1px solid #757575;color:#616161;background:#F5F5F5;font-size:12px;padding:3px 8px;border-radius:12px;vertical-align:middle;font-weight:600;cursor:pointer;" onclick="scrollToPlan(${sweetEquivalentIndex}); event.stopPropagation();">
                                免甜心卡 💡
                                <span class="tooltip-text" style="pointer-events: auto;">
                                    在相同餐點內容下，若搭配甜心卡可再省下 $${diffAmount} 元！<br/>
                                    <strong style="color: #FFBA06; text-decoration: underline; display: block; margin-top: 5px;">👉 點擊此處跳轉至該方案</strong>
                                </span>
                            </span>
                        `;
                    } else {
                        sweetBadge = '<span style="border:1px solid #757575;color:#616161;background:#F5F5F5;font-size:12px;padding:3px 8px;border-radius:12px;vertical-align:middle;font-weight:600;">免甜心卡</span>';
                    }
                }

                blockHtml += `<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #eee;">
                    <div style="display: flex; align-items: baseline; gap: 8px;">
                        <span style="font-size: 22px; font-weight: bold; color: #ff6b35;">$${planData.total}</span>
                        <span style="font-size: 15px; color: #4CAF50;">(省 $${planData.savings})</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <button class="fav-btn-small" style="position: static; padding: 4px 8px;" onclick="saveFavorite(${planIndex})">❤️ 收藏</button>
                        ${sweetBadge}
                    </div>
                </div>`;

                if (planData.upsell) {
                    blockHtml += `<div class="upsell-highlight-box">`;
                    blockHtml += `<strong>✨ 超值升級：</strong>加 $${planData.upsell.extra_cost} 元送 ${planData.upsell.item_name}（原價 $${planData.upsell.original_price} 元）</div>`;
                }

                if (planData.replaced && planData.replaced.length > 0) {
                    blockHtml += `<div style="background-color: #E3F2FD; border-left: 4px solid #2196F3; padding: 10px 12px; margin-bottom: 10px; border-radius: 6px; font-size: 15px; color: #1976D2;">`;
                    blockHtml += `<strong>💡 調整：</strong>`;
                    planData.replaced.forEach((r, i) => {
                        blockHtml += `${i > 0 ? '；' : ''}${r.from} → ${r.to} x${r.qty}`;
                    });
                    blockHtml += `</div>`;
                }

                // Inline Accordion button
                blockHtml += `<button class="toggle-btn" id="toggle-btn-${planIndex}" onclick="togglePlanItems(${planIndex})">▼ 展開完整方案</button>`;

                // Inline plan items wrapper
                blockHtml += `<div class="plan-items" id="plan-items-${planIndex}">`;

                // Combos
                planData.combos.forEach(c => {
                    const rowClass = c.option_name === '單點' ? 'single' : 'combo';
                    let displayName = '';
                    if (c.option_name === '單點') {
                        displayName = `單點 ${c.items[0]} x${c.qty}`;
                    } else {
                        displayName = `【${c.option_name}】(${c.items.join(' + ')}) x${c.qty}`;
                    }

                    blockHtml += `<div class="item-row ${rowClass}">
                        <span class="item-name">${displayName}</span>
                        <span class="item-price">$${c.price * c.qty}元</span>
                    </div>`;
                });

                // Single Items
                planData.single_items.forEach(item => {
                    const itemInfo = getItemInfo(item.name);
                    const price = itemInfo ? itemInfo.price * item.qty : 0;
                    blockHtml += `<div class="item-row single">
                        <span class="item-name">單點 ${item.name} x${item.qty}</span>
                        <span class="item-price">$${price}元</span>
                    </div>`;
                });

                // Extra Items
                planData.extra_items.forEach(item => {
                    blockHtml += `<div class="item-row new">
                        <span class="item-name">(多送) ${item.name} x${item.qty}</span>
                        <span class="item-price">含在套餐</span>
                    </div>`;
                });

                // Original Total Reference (Optional but good to have inside accordion)
                blockHtml += `<div style="text-align: right; color: #666; font-size: 13px; margin-top: 10px;">原價單點總計: $${planData.original_total}</div>`;

                // Copy Button acting as Commit
                blockHtml += `<button class="confirm-btn" onclick="copyOrderText(${planIndex})">📋 複製點餐方案</button>`;

                blockHtml += `</div></div>`;

                html += blockHtml;
            });

            document.getElementById('result').innerHTML = html;
            document.getElementById('recommendations').innerHTML = '';
        }



        async function saveFavorite(index) {
            const plan = planOptions[index];
            if (!plan) return;

            try {
                const response = await fetch('/api/favorites', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(plan)
                });

                if (response.status === 401) {
                    alert('請先返回首頁登入會員，才能使用收藏功能！');
                    return;
                }

                const result = await response.json();
                if (result.status === 'success') {
                    alert('已成功加入收藏清單！');
                } else {
                    alert(result.message || '儲存失敗，請稍後再試。');
                }
            } catch (error) {
                console.error('收藏失敗:', error);
                alert('發生錯誤，請稍後再試。');
            }
        }

        // Modal functions removed

        function copyOrderText(index) {
            const plan = planOptions[index];
            if (!plan) return;

            // 1. 如果有運作中的 30 秒自動寫入計時器，將其清除
            if (activeHistoryTimers[index]) {
                clearTimeout(activeHistoryTimers[index]);
                delete activeHistoryTimers[index];
            }

            // 2. 立即寫入歷史紀錄 (若先前尚未因滿 30 秒寫入)
            saveToHistorySilently(index);

            let lines = [];
            lines.push(`【點餐指令】`);

            plan.combos.forEach(c => {
                if (c.option_name === '單點') {
                    lines.push(`單點：${c.qty} 份 ${c.items[0]}`);
                } else {
                    lines.push(`${c.qty} 份 ${c.option_name} (${c.items.join(' + ')})`);
                }
            });

            plan.single_items.forEach(item => {
                lines.push(`單點：${item.qty} 份 ${item.name}`);
            });

            if (plan.replaced && plan.replaced.length > 0) {
                lines.push(`(備註：此方案包含以下替代)`);
                plan.replaced.forEach(r => {
                    lines.push(`- ${r.from} 換成 ${r.to}`);
                });
            }

            const textToCopy = lines.join('\n');
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert('已複製點餐指令！\n\n' + textToCopy);
                }).catch(err => {
                    console.error('複製失敗:', err);
                    alert('複製失敗，請手動複製。\n\n' + textToCopy);
                });
            } else {
                alert(textToCopy);
            }
        }

        init();
    </script>
    </div>
</body>

</html>
