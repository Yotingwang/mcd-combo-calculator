<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收藏清單</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #FFBA06;
            padding: 20px;
            padding-bottom: 100px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
            min-height: 50px;
        }
        .back-btn {
            padding: 15px 25px;
            font-size: 16px;
            background-color: white;
            color: #FFBA06;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 10;
        }
        h1 {
            color: white;
            text-align: center;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            font-size: 24px;
            white-space: nowrap;
        }
        .main-box {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 2px solid #FFBA06;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #FFBA06;
        }
        .card-header .meta {
            font-size: 13px;
            color: #999;
        }
        .delete-btn {
            padding: 5px 12px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }
        .delete-btn:hover {
            background: #cc0000;
        }
        .price-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 12px;
        }
        .price-total {
            font-size: 26px;
            font-weight: bold;
            color: #ff6b35;
        }
        .price-savings {
            font-size: 15px;
            color: #4CAF50;
        }
        .sweet-badge {
            display: inline-block;
            background: #E91E63;
            color: white;
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .no-sweet-badge {
            display: inline-block;
            background: #9E9E9E;
            color: white;
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .item-row {
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
        .item-row.combo {
            background: #E8F5E9;
            border-left: 4px solid #4CAF50;
        }
        .item-row.single {
            background: #FFF3E0;
            border-left: 4px solid #FF9800;
        }
        .item-row.extra {
            background: #EDE7F6;
            border-left: 4px solid #7E57C2;
        }
        .item-name { color: #333; }
        .item-price { color: #ff6b35; font-weight: bold; }
        .replaced-block {
            background: #FFF8E1;
            border-left: 4px solid #FFC107;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #795548;
        }
        .section-label {
            font-size: 13px;
            font-weight: bold;
            color: #666;
            margin: 10px 0 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .empty-state {
            text-align: center;
            color: white;
            font-size: 18px;
            padding: 60px 20px;
        }
        .empty-state p {
            margin-top: 10px;
            font-size: 15px;
            opacity: 0.85;
        }
        .login-prompt {
            text-align: center;
            background: white;
            border-radius: 16px;
            padding: 40px 20px;
            margin-top: 20px;
        }
        .login-prompt h2 {
            color: #FFBA06;
            margin-bottom: 10px;
        }
        .login-prompt p {
            color: #666;
            margin-bottom: 20px;
        }
        .login-prompt button {
            padding: 12px 30px;
            background: #FFBA06;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <button class="back-btn" onclick="location.href='index.html'">← 返回首頁</button>
            <h1>收藏清單</h1>
        </div>

        <div id="result"></div>

    <script>
        async function init() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="empty-state">載入中...</div>';

            try {
                const response = await fetch('/api/favorites');

                if (response.status === 401) {
                    resultDiv.innerHTML = `
                        <div class="login-prompt">
                            <h2>尚未登入</h2>
                            <p>請先登入會員，才能查看您的收藏清單。</p>
                            <button onclick="location.href='index.html'">前往登入</button>
                        </div>`;
                    return;
                }

                const result = await response.json();
                if (result.status !== 'success' || result.data.length === 0) {
                    resultDiv.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size:48px;">⭐</div>
                            <div>尚無收藏方案</div>
                            <p>前往計算結果頁，點擊 ❤️ 收藏 按鈕即可加入！</p>
                        </div>`;
                    return;
                }

                renderFavorites(result.data);
            } catch (error) {
                resultDiv.innerHTML = '<div class="empty-state">載入失敗，請稍後再試。</div>';
                console.error(error);
            }
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function renderFavorites(favorites) {
            const resultDiv = document.getElementById('result');
            let html = '';

            favorites.forEach(fav => {
                const plan = typeof fav.plan_data === 'string' ? JSON.parse(fav.plan_data) : fav.plan_data;
                const savedAt = formatDate(fav.created_at);

                html += `<div class="main-box">`;

                // 卡片標頭：時間 + 刪除按鈕
                html += `<div class="card-header">
                    <div class="meta">收藏於 ${savedAt}</div>
                    <button class="delete-btn" onclick="deleteFavorite(${fav.id}, this)">刪除</button>
                </div>`;

                // 甜心卡標籤
                const badge = plan.isSweet
                    ? `<span class="sweet-badge" style="margin-bottom:0; vertical-align:middle;">💳 需有甜心卡</span>`
                    : `<span class="no-sweet-badge" style="margin-bottom:0; vertical-align:middle;">免甜心卡</span>`;

                // 總價與省錢金額
                html += `<div class="price-row" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <div>
                        <span class="price-total">$${plan.total}</span>
                        <span class="price-savings">（省 $${plan.savings}）</span>
                    </div>
                    ${badge}
                </div>`;

                // 餐點明細（依原始順序排列）
                if (plan.combos && plan.combos.length > 0) {
                    plan.combos.forEach(c => {
                        const isCombo = c.option_name !== '單點';
                        const rowClass = isCombo ? 'combo' : 'single';
                        const name = isCombo
                            ? `【${c.option_name}】${c.items ? c.items.join(' + ') : ''} x${c.qty}`
                            : `${c.items ? c.items[0] : ''} x${c.qty}`;
                        html += `<div class="item-row ${rowClass}">
                            <span class="item-name">${name}</span>
                            <span class="item-price">$${c.price * c.qty}</span>
                        </div>`;
                    });
                }

                // 額外單點
                if (plan.single_items && plan.single_items.length > 0) {
                    html += `<div class="section-label">額外單點</div>`;
                    plan.single_items.forEach(item => {
                        html += `<div class="item-row extra">
                            <span class="item-name">${item.name} x${item.qty}</span>
                            <span class="item-price">$${item.price || ''}</span>
                        </div>`;
                    });
                }

                // 多送品項
                if (plan.extra_items && plan.extra_items.length > 0) {
                    html += `<div class="section-label">多送品項</div>`;
                    plan.extra_items.forEach(item => {
                        html += `<div class="item-row extra">
                            <span class="item-name">(多送) ${item.name} x${item.qty}</span>
                            <span class="item-price">含在套餐</span>
                        </div>`;
                    });
                }

                // 替換明細
                if (plan.replaced && plan.replaced.length > 0) {
                    html += `<div class="section-label">替換明細</div>`;
                    plan.replaced.forEach(r => {
                        html += `<div class="replaced-block">🔄 ${r.from} → ${r.to} x${r.qty}</div>`;
                    });
                }

                html += `</div>`;
            });

            resultDiv.innerHTML = html;
        }

        async function deleteFavorite(id, btn) {
            if (!confirm('確定要刪除此筆收藏？')) return;

            try {
                const response = await fetch(`/api/favorites/${id}`, { method: 'DELETE' });
                const result = await response.json();
                if (result.status === 'success') {
                    // 移除整個卡片
                    btn.closest('.main-box').remove();
                    // 若全部刪除後顯示空狀態
                    if (document.querySelectorAll('.main-box').length === 0) {
                        document.getElementById('result').innerHTML = `
                            <div class="empty-state">
                                <div style="font-size:48px;">⭐</div>
                                <div>尚無收藏方案</div>
                                <p>前往計算結果頁，點擊 ❤️ 收藏 按鈕即可加入！</p>
                            </div>`;
                    }
                } else {
                    alert(result.message || '刪除失敗，請稍後再試。');
                }
            } catch (error) {
                alert('發生錯誤，請稍後再試。');
            }
        }

        init();
    </script>
    </div>
</body>
</html>
